name: nfs-provisioner
type: helm
enabled: true
namespace: nfs-provisioner
chart: nfs-provisioner/nfs-server-provisioner
valuesTemplate: templates/nfs-server-provisioner-values.yml.tmpl
hooks:
  preInstall:
    - "helm repo add nfs-provisioner https://kubernetes-sigs.github.io/nfs-ganesha-server-and-external-provisioner/"
    - "helm repo update"
    - "kubectl create namespace nfs-provisioner --dry-run=client -o yaml | kubectl apply -f -"
  postInstall:
    # The release name is the component name, so the chart's resources are
    # prefixed nfs-provisioner-. The chart ships a StatefulSet, not a
    # Deployment, so 'wait --for=condition=Available' does not apply.
    - "kubectl rollout status statefulset/nfs-provisioner-nfs-server-provisioner -n nfs-provisioner --timeout=300s"
